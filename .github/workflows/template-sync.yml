name: Sync template files

# Dispara quando arquivos compartilhados mudam no template.
# Abre PRs automáticos nos repos listados em .github/sync.yml.
on:
  push:
    branches: [main]
    paths:
      - '.gitignore'
      - '.npmrc'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'tsconfig.test.json'
      - '.github/sync.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/publish.yml'
  workflow_dispatch: # permite trigger manual via GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync files to consumer repos
        uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_PAT: ${{ secrets.SYNC_TOKEN }}
          # SYNC_TOKEN: PAT com escopo repo nas orgs necessárias.
          # Criar em: https://github.com/settings/tokens
          # Adicionar como secret em Settings > Secrets > Actions
          PR_LABELS: 'template-sync,automated'
          COMMIT_BODY: 'Sync automático via mri-module-template'
          PR_TITLE: 'chore: sync template files'
