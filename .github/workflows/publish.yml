name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mri-bot'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build
        run: pnpm build

      # Valida o package.json antes do publish: exports apontando pra arquivos
      # que existem, types/main coerentes, ESM+CJS bem mapeados. Foi a issue
      # mri-bot/mri_botcreator#69 que motivou esse step (1.4.0 do mri-ui era
      # ESM-only e backend NestJS em CJS estourava "No exports main defined").
      - name: Validate package metadata (publint)
        run: pnpm dlx publint --strict

      - name: Publish to GitHub Packages
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
